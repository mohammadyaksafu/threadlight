# Run: npx promptfoo@0.103.5 eval -c evals/promptfooconfig.yaml  (needs GEMINI_API_KEY)
description: 'ThreadLight extraction prompt regression: 30 fixed synthetic documents (24 English, 6 Bangla). Fails CI on any regression.'
prompts:
- extract (rendered in evals/promptfoo_provider.py from backend/prompts/extract_v*.yaml)
providers:
- id: file://evals/promptfoo_provider.py
  label: router:extract
